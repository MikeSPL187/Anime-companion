name: ani_app
description: Local-first Android anime companion for catalog lookup, library tracking, progress, schedule, and trust controls.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  cached_network_image: ^3.4.1
  dio: ^5.9.0
  drift: ^2.28.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  go_router: ^16.2.5
  path_provider: ^2.1.5
  riverpod_annotation: ^3.0.3
  shared_preferences: ^2.5.3
  sqlite3_flutter_libs: ^0.5.39

dev_dependencies:
  build_runner: ^2.8.0
  drift_dev: ^2.28.2
  flutter_test:
    sdk: flutter
  riverpod_generator: ^3.0.3

flutter:
  uses-material-design: true
